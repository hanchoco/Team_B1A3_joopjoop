services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: joopjoop-backend
    env_file:
      - .env
    command: python -m uvicorn app.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    restart: unless-stopped
    volumes:
      - ./review_drafts:/app/review_drafts